<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash of Clans AI Bot - Live Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #fdf2f8 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 2.2rem; color: var(--primary); font-weight: 700; margin-bottom: 5px; }
        header p { color: var(--text-muted); font-size: 0.95rem; }
        .server-status { background: #e0e7ff; border: 1px solid #c7d2fe; padding: 10px 20px; border-radius: 10px; text-align: center; font-weight: 500; margin-bottom: 20px; color: #3730a3; }
        .config-bar { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 25px; border: 1px solid var(--border-color); }
        .input-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 220px; }
        .input-group label { font-weight: 600; font-size: 0.85rem; color: var(--text-main); }
        .input-group select, .input-group input { padding: 10px 14px; border-radius: 8px; border: 2px solid var(--border-color); outline: none; font-size: 0.9rem; background: #f9fafb; }
        .action-panel { background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border-color); text-align: center; }
        .action-panel h2 { margin-bottom: 15px; font-size: 1.2rem; color: var(--text-main); }
        .btn-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .btn { padding: 12px 24px; border-radius: 10px; border: none; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; color: white; transition: 0.3s; }
        .btn-start { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-pause { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-resume { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .btn-stop { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .response-box { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 10px; font-family: monospace; font-size: 0.9rem; margin-top: 20px; text-align: left; max-height: 120px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-robot"></i> Clash of Clans AI Live Control</h1>
            <p>Directly Connected to Python Flask Background Engine</p>
        </header>

        <div class="server-status">
            <i class="fa-solid fa-circle-check" style="color: var(--success);"></i> Dashboard Loaded via Local Flask Server
        </div>

        <div class="config-bar">
            <div class="input-group">
                <label for="deviceSelect"><i class="fa-solid fa-mobile-screen"></i> Target Device</label>
                <select id="deviceSelect">
                    <option value="a14" selected>Samsung Galaxy A14 (Base Resolution)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="modeSelect"><i class="fa-solid fa-sliders"></i> Select Bot Mode</label>
                <select id="modeSelect">
                    <option value="1">Mode 1: Fast Attack Only</option>
                    <option value="2">Mode 2: Building Upgrade Only</option>
                    <option value="3">Mode 3: Wall Upgrade Only</option>
                    <option value="4">Mode 4: Tried All (Attack + Build + Wall)</option>
                    <option value="5">Mode 5: ID Changement Only</option>
                    <option value="6">Mode 6: ID + Fast Attack</option>
                    <option value="7" selected>Mode 7: Fully Botted System (Default)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="totalIds"><i class="fa-solid fa-users"></i> Total IDs</label>
                <input type="number" id="totalIds" value="10" min="1" max="100">
            </div>
        </div>

        <div class="action-panel">
            <h2><i class="fa-solid fa-gamepad"></i> Bot Command Center</h2>
            <div class="btn-grid">
                <button class="btn btn-start" onclick="sendApiCommand('start')"><i class="fa-solid fa-play"></i> Start Bot</button>
                <button class="btn btn-pause" onclick="sendApiCommand('pause')"><i class="fa-solid fa-pause"></i> Pause Bot</button>
                <button class="btn btn-resume" onclick="sendApiCommand('resume')"><i class="fa-solid fa-rotate-right"></i> Resume Bot</button>
                <button class="btn btn-stop" onclick="sendApiCommand('stop')"><i class="fa-solid fa-stop"></i> Stop Bot</button>
            </div>
            <div id="responseLog" class="response-box">
                [System Ready] Click any command above to trigger python background bot...
            </div>
        </div>
    </div>

    <script>
        const serverUrl = "";

        function logOutput(text) {
            const logBox = document.getElementById('responseLog');
            logBox.innerHTML += `<br>> ${text}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function sendApiCommand(action) {
            let endpoint = `${serverUrl}/${action}`;
            if (action === 'start') {
                const mode = document.getElementById('modeSelect').value;
                const totalIds = document.getElementById('totalIds').value;
                endpoint = `${serverUrl}/start/${mode}?total=${totalIds}&start=1`;
            }

            logOutput(`Sending request: GET ${endpoint}`);

            fetch(endpoint)
                .then(response => response.json())
                .then(data => {
                    logOutput(`Response: ${JSON.stringify(data)}`);
                })
                .catch(error => {
                    logOutput(`[Error]: Could not reach Flask server.`);
                    console.error("API Error:", error);
                });
        }
    </script>
</body>
</html>
